<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Fraunces & Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- GIFT OVERLAY -->
    <div id="gift-screen">
        <div class="gift-container" id="gift-container">
            <div class="gift-box">
                <div class="ribbon-vertical"></div>
                <div class="ribbon-horizontal"></div>
                <div class="bow">🎀</div>
            </div>
            <p class="click-to-open">Tap to Open 💝</p>
        </div>
    </div>

    <!-- Starry Background Canvas -->
    <canvas id="star-canvas"></canvas>

    <!-- SECTION 1: SAWAL JAWAB (First Section) -->
    <section id="quiz-section" class="question-section">
        <div id="quiz-container" class="question-container">
            <!-- JS will dynamically inject the Quiz here -->
        </div>
    </section>

        <!-- SECTION 2: HAPPY BIRTHDAY SLIDE -->
        <section id="hero" class="hero-section" style="display: none;">
            <div class="hero-bg" id="hero-bg"></div>
            <div class="hero-overlay" id="hero-overlay"></div>
            <div class="hero-content">
                <h1 id="hero-title" class="hidden-text">Happy Birthday <span id="hero-name"></span></h1>
                <p id="hero-subtitle" class="hidden-text story-text mt-3" style="font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">Happy Birthday bachaaaaaaaaaa 🧚🐥🐥</p>
                <p id="hero-message" class="hero-long-message mt-3" data-text="Happy birthday, bachaaaaaaa 🐥🫂🫂 May my Mahadev always bless youuu tara life ni harek wise puri thaii thay 🤞and thank you bachaaaa🐥🪿 mari life ma aava mate me mari mari life na a move ment tari jode jivya che mara sapna hataaa hun manu chu ki mari bhulo thay che but tu sache ek gift che mari life ma hala ki mari pase hal kaii nathi but tu che ne mari jodeee aavu feel thay che ne wahhhh ek god gift aaapi che bhagvan am lage che 🫂👥❤️🌹🌎🥭🦢💋💕💕👥"></p>
            </div>
        </section>

        <!-- SECTION 3: YAADON KA SAFAR (5 PHOTOS) -->
        <section id="journey" class="journey-section" style="display: none;">
            <h2 class="glow-text text-center mb-5" style="font-size: 2.5rem; margin-top: 50px;">Yaadon Ka Safar ✨</h2>
            <div id="journey-container" class="journey-container">
            </div>
        </section>

    <script src="script.js"></script>
</body>
</html>
