<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Fraunces & Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Starry Background Canvas -->
    <canvas id="star-canvas"></canvas>

    <!-- SECTION 1: OPENING -->
    <header id="hero" class="hero-section">
        <div class="hero-bg" id="hero-bg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 id="hero-title" class="hidden-text">Happy Birthday <span id="hero-name"></span></h1>
            <p id="hero-subtitle" class="hidden-text story-text mt-3" style="font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">Happy Birthday bachaaaaaaaaaa 🧚🐥🐥</p>
        </div>
    </header>

    <!-- SECTION 2: JOURNEY -->
    <section id="journey" class="journey-section">
        <div class="timeline-line"></div>
        <div id="journey-container" class="journey-container">
            <!-- JS will dynamically inject the 6 photos here based on the Config Object -->
        </div>
    </section>

    <!-- SECTION 3: SAWAL JAWAB (Slide 2) -->
    <section id="quiz-section" class="question-section">
        <div id="quiz-container" class="question-container glass-card hidden-text">
            <!-- JS will dynamically inject the Quiz here -->
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
