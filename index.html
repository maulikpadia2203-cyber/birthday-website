<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betuu ka Aasmaan</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Starry Background -->
    <canvas id="star-canvas"></canvas>

    <!-- Audio Player -->
    <button id="audio-toggle" class="audio-btn">
        <i class="fas fa-music"></i>
    </button>
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Journey Container -->
    <div id="journey-container">
        
        <!-- Welcome Screen -->
        <div id="screen-intro" class="intro-screen">
            <div class="glass-card text-center fade-in-slow">
                <h1 class="glow-text">Happy Birthday Betuu</h1>
                <p class="subtitle mt-2">Aaj exam nahi, aaj sirf hamari kahani hai...</p>
                <button id="start-btn" class="btn-gold mt-3">Apni Kahani Shuru Karein ✨</button>
            </div>
        </div>

        <!-- The Journey Content (Hidden until start) -->
        <div id="story-content" class="hidden">
            <!-- JS will inject story blocks here as you tell me -->
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
