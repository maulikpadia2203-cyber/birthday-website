<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Fraunces & Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- GIFT OVERLAY -->
    <div id="gift-screen">
        <div class="gift-container" id="gift-container">
            <div class="gift-box">
                <div class="ribbon-vertical"></div>
                <div class="ribbon-horizontal"></div>
                <div class="bow">🎀</div>
            </div>
            <p class="click-to-open">Tap to Open 💝</p>
        </div>
    </div>

    <!-- Starry Background Canvas -->
    <canvas id="star-canvas"></canvas>

    <!-- SECTION 1: SAWAL JAWAB (First Section) -->
    <section id="quiz-section" class="question-section">
        <div id="quiz-container" class="question-container">
            <!-- JS will dynamically inject the Quiz here -->
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
